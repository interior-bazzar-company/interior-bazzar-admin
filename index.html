<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/ib.ico" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Interior bazzar · Admin</title>
  <meta name="description"
    content="Interior bazzar Admin — the single operating workspace for every module." />

  <!-- Brand faces. Local-first with a graceful system fallback; nothing here blocks paint. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media = 'all'"
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400&family=Roboto+Mono:wght@400;500&display=swap" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" />
  </noscript>

  <script>
    // Pre-paint so the panel never flashes the wrong theme. ShellContext re-runs
    // the same resolution; this one exists only to beat the first paint.
    //
    // Two selectors, one state: `data-theme` is the panel's own; `dark-mode` /
    // `light-mode` is how Untitled UI selects a theme, so a component from
    // their library reads the same state with no translation layer. "System"
    // is resolved HERE, from prefers-color-scheme, the way Untitled UI's own
    // ThemeProvider does it — so the stylesheet needs one dark block, not
    // three. Nothing stored means dark, the panel's default since the first build.
    (function () {
      try {
        var r = document.documentElement,
          t = localStorage.getItem("ib_admin_theme"),
          d = localStorage.getItem("ib_admin_density");
        t = t ? JSON.parse(t) : "dark";
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        r.classList.remove("dark-mode", "light-mode");
        r.classList.add(dark ? "dark-mode" : "light-mode");
        r.setAttribute("data-theme", dark ? "dark" : "light");
        if (t === "system") r.setAttribute("data-theme-pref", "system");
        if (d) r.setAttribute("data-density", JSON.parse(d));
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
